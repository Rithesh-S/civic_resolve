name: municipal_officer_app
description: A new Flutter project for municipal officers.
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  image_picker: ^1.0.7
  google_nav_bar: ^5.0.6
  url_launcher: ^6.2.6
  geolocator: ^12.0.0
  http: ^1.2.1
  flutter_secure_storage: ^9.2.2
  http_parser: ^4.0.2

  # State Management
  flutter_bloc: ^8.1.3

  # API & Networking
  dio: ^5.3.3

  # Mapping
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  intl: ^0.20.2

  # UI & Styling
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.2

  # Utility
  equatable: ^2.0.5
  shared_preferences: ^2.2.2 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true